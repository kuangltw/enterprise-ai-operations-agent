name: enterprise-ai-operations-agent
services:
  web:
    build:
      context: ./apps/web
    ports:
      - "127.0.0.1:5173:80"
    networks: [internal]

  agent-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${AGENT_DB_NAME:?請設定 AGENT_DB_NAME}
      POSTGRES_USER: ${AGENT_DB_USER:?請設定 AGENT_DB_USER}
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:?請設定 AGENT_DB_PASSWORD}
    volumes:
      - agent_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]

  erp-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${ERP_DB_NAME:?請設定 ERP_DB_NAME}
      POSTGRES_USER: ${ERP_DB_USER:?請設定 ERP_DB_USER}
      POSTGRES_PASSWORD: ${ERP_DB_PASSWORD:?請設定 ERP_DB_PASSWORD}
    volumes:
      - erp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  qdrant:
    image: qdrant/qdrant:v1.13.6
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [internal]

  minio:
    image: public.ecr.aws/y9w4h2u9/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?請設定 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?請設定 MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks: [internal]

  agent-migrate:
    build:
      context: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${AGENT_DB_USER}:${AGENT_DB_PASSWORD}@agent-db:5432/${AGENT_DB_NAME}
    depends_on:
      agent-db:
        condition: service_healthy
    restart: "no"
    networks: [internal]

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://${AGENT_DB_USER}:${AGENT_DB_PASSWORD}@agent-db:5432/${AGENT_DB_NAME}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      ERP_BASE_URL: http://demo-erp:8080
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
      demo-erp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 10
    networks: [internal]

  demo-erp:
    build:
      context: ./apps/demo-erp
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__ErpDb: Host=erp-db;Port=5432;Database=${ERP_DB_NAME};Username=${ERP_DB_USER};Password=${ERP_DB_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      erp-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 4s
      retries: 10
    networks: [internal]

volumes:
  agent_db_data:
  erp_db_data:
  redis_data:
  qdrant_data:
  minio_data:

networks:
  internal:
    driver: bridge
