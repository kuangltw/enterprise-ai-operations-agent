services:
  agent-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: e2e
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: ${E2E_DB_PASSWORD:?由 E2E 執行器產生資料庫密碼}
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d e2e"]
      interval: 2s
      timeout: 2s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  agent-migrate:
    build: ./apps/api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://e2e:${E2E_DB_PASSWORD}@agent-db:5432/e2e
    depends_on:
      agent-db:
        condition: service_healthy
    restart: "no"

  api:
    build: ./apps/api
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql+psycopg://e2e:${E2E_DB_PASSWORD}@agent-db:5432/e2e
      JWT_SIGNING_KEY: ${E2E_JWT_KEY:?由 E2E 執行器產生測試簽章金鑰}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      agent-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 20

  web:
    build: ./apps/web
    ports:
      - "127.0.0.1:${E2E_WEB_PORT:?由 E2E 執行器選擇本機連接埠}:80"
    depends_on:
      api:
        condition: service_healthy
