name: 機密資訊掃描
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks（機密掃描）
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼與歷史
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 設定 Go 編譯環境
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
      - name: 安裝 Gitleaks（固定版本）
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.28.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: 掃描目前檔案
        run: gitleaks dir --no-banner --redact --exit-code 1 .
      - name: 掃描 Git 歷史
        run: gitleaks git --no-banner --redact --exit-code 1 .
