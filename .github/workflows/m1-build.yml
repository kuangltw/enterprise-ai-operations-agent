name: M1 基礎建置與測試

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      RUN_POSTGRES_TESTS: '1'
      RUN_REDIS_TESTS: '1'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝相依套件
        run: pip install -r apps/api/requirements-dev.txt
      - name: Python 語法檢查
        run: python -m compileall -q apps/api/src apps/api/migrations
      - name: 套用 Alembic Migration
        working-directory: apps/api
        run: alembic upgrade head
      - name: 單元與 PostgreSQL、Redis 整合測試
        working-directory: apps/api
        run: pytest -p no:cacheprovider -q

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: C# 建置
        run: dotnet build apps/demo-erp/EnterpriseDemoErp.csproj -c Release
      - name: 驗證 EF Core Migration 與模型一致
        env:
          ConnectionStrings__ErpDb: Host=localhost;Database=demo_erp;Username=unused;Password=unused
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-tools" dotnet-ef --version 10.0.13
          "$RUNNER_TEMP/dotnet-tools/dotnet-ef" migrations has-pending-model-changes --project apps/demo-erp/EnterpriseDemoErp.csproj

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安裝前端套件
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: 前端相依套件安全稽核
        working-directory: apps/web
        run: npm audit --audit-level=high
      - name: 前端建置
        working-directory: apps/web
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 驗證 Compose 設定
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: 驗證 MinIO 映像可取得
        run: docker compose pull minio
